<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thoughts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#5B6CFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thoughts">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F2F3F8; --card:#FFFFFF; --ink:#0F1222; --muted:#6B7280; --line:#E5E7EB;
  --accent:#5B6CFF; --accent2:#8B5CF6; --danger:#E11D48; --track:#D1D5DB; --chip-bg:#F1F2F6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0B0B14; --card:#16161F; --ink:#F3F4F6; --muted:#9CA3AF; --line:#2A2A35; --track:#3A3A46; --chip-bg:#20202B; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif;}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom));}
button{font:inherit;}
input,textarea{font:inherit;color:inherit;}

.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line);}
.topbar-inner{display:flex;align-items:center;gap:8px;padding:10px 16px;}
.brand{display:flex;flex-direction:column;flex:1;min-width:0;}
.brand-title{font-size:19px;font-weight:700;letter-spacing:-.2px;}
.brand-sub{font-size:12px;color:var(--muted);}
.icon-btn{background:none;border:none;font-size:19px;padding:8px;line-height:1;border-radius:10px;cursor:pointer;}
.icon-btn:active{background:var(--chip-bg);}
.search-row{padding:0 16px 10px;}
.search-row input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);}

.card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 20px rgba(0,0,0,.05);margin:14px 16px;padding:14px;}
.composer-text{width:100%;border:none;background:transparent;resize:none;outline:none;font-size:16px;min-height:44px;max-height:240px;line-height:1.4;}
.composer-extras{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.save-btn{margin-top:10px;}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.filter-row{margin:0 16px 12px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--chip-bg);font-size:13px;color:var(--ink);white-space:nowrap;border:1px solid transparent;}
.chip[style*="--c"]{background:color-mix(in srgb, var(--c) 18%, var(--chip-bg));color:color-mix(in srgb, var(--c) 65%, var(--ink));}
.chip-muted{color:var(--muted);}
.chip-btn{cursor:pointer;}
.chip-selected{outline:2px solid var(--c, var(--accent));font-weight:600;}
.chip-suggested{border:1px dashed var(--c, var(--accent));}
.chip-add{cursor:pointer;background:transparent;border:1px dashed var(--line);color:var(--muted);}
.filter-chip{cursor:pointer;}

.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none;}
.switch input{display:none;}
.switch-track{width:42px;height:26px;border-radius:999px;background:var(--track);position:relative;transition:background .2s;flex-shrink:0;}
.switch-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s;}
.switch input:checked + .switch-track{background:var(--accent);}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);}
.note-input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);}

.dup-panel{background:color-mix(in srgb, var(--accent) 10%, var(--card));border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line));border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.dup-title{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.4px;}
.dup-item{border-top:1px solid var(--line);padding-top:8px;}
.dup-item:first-of-type{border-top:none;padding-top:0;}
.dup-text{font-size:14px;margin-bottom:2px;}
.dup-meta{font-size:12px;color:var(--muted);margin-bottom:6px;}
.dup-view{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:0;cursor:pointer;}

.list{padding:0 4px;}
.empty{text-align:center;color:var(--muted);padding:40px 24px;font-size:14px;}
.entry{display:flex;flex-direction:column;gap:6px;}
.entry-top{display:flex;align-items:center;gap:8px;}
.entry-top .time{margin-left:auto;font-size:12px;color:var(--muted);flex-shrink:0;}
.action-check{background:none;border:none;font-size:16px;cursor:pointer;padding:0;}
.entry-text{font-size:15px;line-height:1.45;white-space:pre-wrap;cursor:pointer;}
.entry.done .entry-text{text-decoration:line-through;color:var(--muted);}
.entry-action{font-size:13px;color:var(--muted);}
.entry.flash{animation:flash 1.6s ease;}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 20px rgba(0,0,0,.05);}}

.entry.editing{gap:10px;}
.edit-text{width:100%;min-height:70px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);resize:vertical;}
.edit-actions{display:flex;gap:8px;justify-content:flex-end;}
.btn-primary,.btn-secondary,.btn-danger{border:none;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:14px;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-secondary{background:var(--chip-bg);color:var(--ink);}
.btn-danger{background:none;color:var(--danger);}
.full{width:100%;}
.file-btn{display:flex;align-items:center;justify-content:center;text-align:center;}

.install-hint{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:13px;z-index:8;}
.install-hint button{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;flex-shrink:0;}

.sheet{position:fixed;inset:0;z-index:10;visibility:hidden;pointer-events:none;}
.sheet.open{visibility:visible;pointer-events:auto;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;}
.sheet.open .sheet-backdrop{opacity:1;}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;max-height:82vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom));}
.sheet.open .sheet-panel{transform:translateY(0);}
.sheet-handle{width:40px;height:5px;border-radius:999px;background:var(--line);margin:10px auto;}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:0 18px 8px;}
.sheet-header h3{margin:0;font-size:17px;}
.sheet-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:18px;}
.settings-section{display:flex;flex-direction:column;gap:10px;}
.settings-section h4{margin:0 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
.settings-row{font-size:13px;color:var(--muted);}
.topic-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.topic-row:last-child{border-bottom:none;}
.topic-count{font-size:12px;color:var(--muted);}
.topic-row button{margin-left:auto;background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;}
.topic-row button.danger{color:var(--danger);}
.muted{color:var(--muted);}
.small{font-size:12px;line-height:1.5;}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-title">💭 Thoughts</span>
        <span class="brand-sub" id="statsLine">0 thoughts captured</span>
      </div>
      <button class="icon-btn" onclick="toggleSearch()" aria-label="Search">🔍</button>
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙️</button>
    </div>
    <div class="search-row" id="searchRow" style="display:none">
      <input type="search" id="searchInput" placeholder="Search thoughts, topics, actions…" oninput="filter.search=this.value; renderList();">
    </div>
  </header>

  <div class="card composer">
    <textarea id="composerText" class="composer-text" rows="2" placeholder="What just popped into your mind?" oninput="autoResize(this); onComposerInput();" onkeydown="handleComposerKeydown(event)"></textarea>
    <div id="composerExtras" class="composer-extras"></div>
    <button type="button" class="btn-primary full save-btn" onclick="saveThought()">Save thought</button>
  </div>

  <div class="chip-row filter-row" id="filterChips"></div>
  <div id="list" class="list"></div>

</div>

<div id="installHint" class="install-hint" style="display:none">
  <span>Add to your Home Screen: tap <b>Share</b> → <b>Add to Home Screen</b> for the full app experience.</span>
  <button type="button" onclick="dismissInstallHint()">Got it</button>
</div>

<div id="settingsSheet" class="sheet">
  <div class="sheet-backdrop" onclick="closeSettings()"></div>
  <div class="sheet-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h3>Settings</h3><button class="icon-btn" onclick="closeSettings()">✕</button></div>
    <div id="settingsBody" class="sheet-body"></div>
  </div>
</div>

<script>
const LS_ENTRIES = "thoughts.entries.v1";
const LS_TOPICS = "thoughts.topics.v1";
const LS_INSTALL_DISMISS = "thoughts.installHintDismissed.v1";
const PALETTE = ["#FF6B6B","#FFA94D","#F2C744","#51CF66","#20C997","#4DABF7","#748FFC","#9775FA","#DA77F2","#FF8FA3"];
const STOPWORDS = new Set(["the","and","for","are","but","not","you","your","that","this","with","from","have","has","had","was","were","been","will","would","could","should","about","just","need","needs","needed","into","onto","also","its","them","they","then","than","when","what","who","how","why","where","which","some","more","most","very","really","like","get","got","make","made","going","gonna","want","wanna","let","lets"]);

let entries = loadEntries();
let topics = loadTopics();
let filter = { mode: "all", topic: null, search: "" };
let composerTopic = null;
let composerNeedsAction = false;
let composerActionNote = "";
let editState = null;
let composerDebounce = null;

/* ---------- storage ---------- */

function loadEntries(){
  try{ const v = JSON.parse(localStorage.getItem(LS_ENTRIES)); return Array.isArray(v) ? v : []; }
  catch{ return []; }
}
function loadTopics(){
  try{
    const v = JSON.parse(localStorage.getItem(LS_TOPICS));
    if(Array.isArray(v) && v.length) return v;
  }catch{}
  return ["Work","Personal","Ideas","Errands"];
}
function persistEntries(){ localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); }
function persistTopics(){ localStorage.setItem(LS_TOPICS, JSON.stringify(topics)); }

/* ---------- utils ---------- */

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function truncate(s, n){ return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
}
function topicColor(name){
  if(!name) return "#8892A6";
  let h = 0;
  for(const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function relTime(ts){
  const diff = Date.now() - ts;
  const min = 60000, hr = 3600000, day = 86400000;
  if(diff < 45000) return "just now";
  if(diff < hr) return Math.round(diff / min) + "m ago";
  if(diff < day) return Math.round(diff / hr) + "h ago";
  if(diff < 7 * day) return Math.round(diff / day) + "d ago";
  const d = new Date(ts);
  const opts = { month: "short", day: "numeric" };
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
function autoResize(el){
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 240) + "px";
}

/* ---------- similarity + topic suggestion ---------- */

function normalizeWords(text){
  return (text.toLowerCase().match(/[\p{L}\p{N}']+/gu) || []).filter(w => w.length >= 3 && !STOPWORDS.has(w));
}
function wordSet(text){ return new Set(normalizeWords(text)); }
function normalizeForExact(text){ return text.trim().toLowerCase().replace(/\s+/g, " "); }
function jaccard(a, b){
  if(a.size === 0 || b.size === 0) return 0;
  let inter = 0;
  for(const w of a) if(b.has(w)) inter++;
  const union = a.size + b.size - inter;
  return union === 0 ? 0 : inter / union;
}
function findSimilar(text, list, limit = 4, threshold = 0.3){
  const exact = normalizeForExact(text);
  const set = wordSet(text);
  const scored = list.map(e => {
    let score;
    if(exact.length > 0 && normalizeForExact(e.text) === exact) score = 1;
    else score = jaccard(set, wordSet(e.text));
    return { entry: e, score };
  }).filter(s => s.score >= threshold);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit);
}
function suggestTopic(text, list){
  const words = normalizeWords(text);
  if(words.length === 0) return null;
  const freq = {};
  for(const e of list){
    if(!e.topic) continue;
    const f = freq[e.topic] || (freq[e.topic] = {});
    for(const w of normalizeWords(e.text)) f[w] = (f[w] || 0) + 1;
  }
  let best = null, bestScore = 0;
  for(const t of Object.keys(freq)){
    let score = 0;
    for(const w of words) score += freq[t][w] || 0;
    if(score > bestScore){ bestScore = score; best = t; }
  }
  return bestScore > 0 ? best : null;
}

/* ---------- composer ---------- */

function onComposerInput(){
  clearTimeout(composerDebounce);
  composerDebounce = setTimeout(renderComposerExtras, 180);
}
function handleComposerKeydown(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); saveThought(); }
}
function topicChipsRow(selectedTopic, context, suggestion){
  const ordered = topics.slice().sort((a, b) => a.localeCompare(b));
  if(suggestion && ordered.includes(suggestion)){
    ordered.splice(ordered.indexOf(suggestion), 1);
    ordered.unshift(suggestion);
  }
  let html = ordered.map(t => {
    const sel = t === selectedTopic;
    const sug = !sel && t === suggestion;
    return `<button type="button" class="chip chip-btn ${sel ? "chip-selected" : ""} ${sug ? "chip-suggested" : ""}" style="--c:${topicColor(t)}" data-topic="${esc(t)}" onclick="pickTopic('${context}', this.dataset.topic)">${sug ? "✨ " : ""}${esc(t)}</button>`;
  }).join("");
  html += `<button type="button" class="chip chip-add" onclick="addTopicPrompt('${context}')">+ Topic</button>`;
  return html;
}
function dupPanelHTML(matches){
  return `<div class="dup-panel">
    <div class="dup-title">Might already be recorded</div>
    ${matches.map(m => `
      <div class="dup-item">
        <div class="dup-text">${esc(truncate(m.entry.text, 90))}</div>
        <div class="dup-meta">${m.entry.topic ? esc(m.entry.topic) + " • " : ""}${relTime(m.entry.createdAt)} • ${Math.round(m.score * 100)}% similar</div>
        <button type="button" class="dup-view" onclick="jumpToEntry('${m.entry.id}')">View instead of saving again</button>
      </div>`).join("")}
  </div>`;
}
function renderComposerExtras(){
  const ta = document.getElementById("composerText");
  const text = ta ? ta.value : "";
  const words = normalizeWords(text);
  const suggestion = (!composerTopic && words.length > 0) ? suggestTopic(text, entries) : null;
  const dupMatches = words.length >= 2 ? findSimilar(text, entries) : [];
  const box = document.getElementById("composerExtras");
  box.innerHTML = `
    <div class="chip-row">${topicChipsRow(composerTopic, "new", suggestion)}</div>
    <label class="switch">
      <input type="checkbox" ${composerNeedsAction ? "checked" : ""} onchange="composerNeedsAction=this.checked; renderComposerExtras();">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">Needs action</span>
    </label>
    ${composerNeedsAction ? `<input type="text" class="note-input" value="${esc(composerActionNote)}" oninput="composerActionNote=this.value" placeholder="What needs to be done? (optional)">` : ""}
    ${dupMatches.length ? dupPanelHTML(dupMatches) : ""}
  `;
}
function pickTopic(context, topic){
  if(context === "new"){
    composerTopic = (composerTopic === topic) ? null : topic;
    renderComposerExtras();
  } else {
    if(!editState) return;
    editState.topic = (editState.topic === topic) ? null : topic;
    refreshCard(context);
  }
}
function addTopicPrompt(context){
  const name = prompt("New topic name");
  if(name == null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  const existing = topics.find(t => t.toLowerCase() === trimmed.toLowerCase());
  const finalName = existing || trimmed;
  if(!existing){ topics.push(finalName); persistTopics(); }
  if(context === "new"){
    composerTopic = finalName;
    renderComposerExtras();
  } else if(editState){
    editState.topic = finalName;
    refreshCard(context);
  }
  renderFilterChips();
}
function resetComposer(){
  const ta = document.getElementById("composerText");
  ta.value = "";
  autoResize(ta);
  composerTopic = null;
  composerNeedsAction = false;
  composerActionNote = "";
  renderComposerExtras();
}
function saveThought(){
  const ta = document.getElementById("composerText");
  const text = ta.value.trim();
  if(!text) return;
  const topic = composerTopic || suggestTopic(text, entries) || "";
  const now = Date.now();
  entries.unshift({
    id: uid(),
    text,
    topic,
    needsAction: composerNeedsAction,
    actionNote: composerNeedsAction ? composerActionNote.trim() : "",
    done: false,
    createdAt: now,
    updatedAt: now
  });
  persistEntries();
  resetComposer();
  renderAll();
}
function jumpToEntry(id){
  const ta = document.getElementById("composerText");
  ta.value = "";
  autoResize(ta);
  composerTopic = null;
  composerNeedsAction = false;
  composerActionNote = "";
  renderComposerExtras();
  filter = { mode: "all", topic: null, search: "" };
  const searchInput = document.getElementById("searchInput");
  if(searchInput) searchInput.value = "";
  renderAll();
  requestAnimationFrame(() => {
    const el = document.querySelector(`.list [data-id="${id}"]`);
    if(el){
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1600);
    }
  });
}

/* ---------- filters + list ---------- */

function toggleSearch(){
  const row = document.getElementById("searchRow");
  const show = row.style.display === "none";
  row.style.display = show ? "block" : "none";
  if(show){
    requestAnimationFrame(() => document.getElementById("searchInput").focus());
  } else {
    document.getElementById("searchInput").value = "";
    filter.search = "";
    renderList();
  }
}
function setFilter(mode){ filter.mode = mode; filter.topic = null; renderFilterChips(); renderList(); }
function setFilterTopic(t){ filter.mode = "topic"; filter.topic = t; renderFilterChips(); renderList(); }
function renderFilterChips(){
  const el = document.getElementById("filterChips");
  const actionCount = entries.filter(e => e.needsAction && !e.done).length;
  const topicCounts = {};
  entries.forEach(e => { const t = e.topic || ""; topicCounts[t] = (topicCounts[t] || 0) + 1; });
  let html = `<button type="button" class="chip filter-chip ${filter.mode === "all" ? "chip-selected" : ""}" onclick="setFilter('all')">All (${entries.length})</button>`;
  html += `<button type="button" class="chip filter-chip ${filter.mode === "action" ? "chip-selected" : ""}" onclick="setFilter('action')">Needs action (${actionCount})</button>`;
  topics.slice().sort((a, b) => a.localeCompare(b)).forEach(t => {
    const c = topicCounts[t] || 0;
    const sel = filter.mode === "topic" && filter.topic === t;
    html += `<button type="button" class="chip filter-chip ${sel ? "chip-selected" : ""}" style="--c:${topicColor(t)}" data-topic="${esc(t)}" onclick="setFilterTopic(this.dataset.topic)">${esc(t)} (${c})</button>`;
  });
  const uncatCount = topicCounts[""] || 0;
  if(uncatCount > 0){
    const sel = filter.mode === "topic" && filter.topic === "";
    html += `<button type="button" class="chip filter-chip chip-muted ${sel ? "chip-selected" : ""}" onclick="setFilterTopic('')">Uncategorized (${uncatCount})</button>`;
  }
  el.innerHTML = html;
}
function getFilteredEntries(){
  let list = entries.slice();
  if(filter.mode === "action") list = list.filter(e => e.needsAction && !e.done);
  else if(filter.mode === "topic") list = list.filter(e => (e.topic || "") === filter.topic);
  if(filter.search){
    const q = filter.search.toLowerCase();
    list = list.filter(e => e.text.toLowerCase().includes(q) || (e.topic || "").toLowerCase().includes(q) || (e.actionNote || "").toLowerCase().includes(q));
  }
  return list;
}
function entryCardHTML(e){
  if(editState && editState.id === e.id) return editCardHTML(e);
  const rel = relTime(e.updatedAt || e.createdAt);
  const color = topicColor(e.topic);
  return `
  <div class="card entry ${e.done ? "done" : ""}" data-id="${e.id}">
    <div class="entry-top">
      ${e.topic ? `<span class="chip" style="--c:${color}">${esc(e.topic)}</span>` : `<span class="chip chip-muted">Uncategorized</span>`}
      ${e.needsAction ? `<button type="button" class="action-check" onclick="toggleDone('${e.id}', event)">${e.done ? "✅" : "⬜️"}</button>` : ""}
      <span class="time">${rel}</span>
    </div>
    <div class="entry-text" onclick="startEdit('${e.id}')">${esc(e.text)}</div>
    ${e.actionNote ? `<div class="entry-action">➡️ ${esc(e.actionNote)}</div>` : ""}
  </div>`;
}
function editCardHTML(e){
  const s = editState;
  return `
  <div class="card entry editing" data-id="${e.id}">
    <textarea class="edit-text" oninput="editState.text=this.value">${esc(s.text)}</textarea>
    <div class="chip-row">${topicChipsRow(s.topic, e.id, null)}</div>
    <label class="switch">
      <input type="checkbox" ${s.needsAction ? "checked" : ""} onchange="editState.needsAction=this.checked; refreshCard('${e.id}')">
      <span class="switch-track"><span class="switch-thumb"></span></span>
      <span class="switch-label">Needs action</span>
    </label>
    ${s.needsAction ? `<input type="text" class="note-input" value="${esc(s.actionNote)}" oninput="editState.actionNote=this.value" placeholder="What needs to be done? (optional)">` : ""}
    <div class="edit-actions">
      <button type="button" class="btn-secondary" onclick="cancelEdit()">Cancel</button>
      <button type="button" class="btn-danger" onclick="deleteEntry('${e.id}')">Delete</button>
      <button type="button" class="btn-primary" onclick="saveEdit()">Save</button>
    </div>
  </div>`;
}
function renderList(){
  const el = document.getElementById("list");
  const items = getFilteredEntries();
  if(items.length === 0){
    el.innerHTML = `<div class="empty">${entries.length === 0 ? "Nothing captured yet — write your first thought above." : "No thoughts match this filter."}</div>`;
    return;
  }
  el.innerHTML = items.map(entryCardHTML).join("");
}
function refreshCard(id){
  const el = document.querySelector(`.list [data-id="${id}"]`);
  const entry = entries.find(x => x.id === id);
  if(el && entry) el.outerHTML = entryCardHTML(entry);
}

/* ---------- item actions ---------- */

function startEdit(id){
  if(editState && editState.id === id) return;
  const e = entries.find(x => x.id === id);
  if(!e) return;
  editState = { id, text: e.text, topic: e.topic || null, needsAction: !!e.needsAction, actionNote: e.actionNote || "" };
  renderList();
  requestAnimationFrame(() => {
    const ta = document.querySelector(".entry.editing .edit-text");
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
}
function cancelEdit(){ editState = null; renderList(); }
function saveEdit(){
  if(!editState) return;
  const e = entries.find(x => x.id === editState.id);
  if(!e) return;
  const text = editState.text.trim();
  if(!text){ alert("Thought text cannot be empty."); return; }
  e.text = text;
  e.topic = editState.topic || "";
  e.needsAction = editState.needsAction;
  e.actionNote = editState.needsAction ? editState.actionNote.trim() : "";
  if(!e.needsAction) e.done = false;
  e.updatedAt = Date.now();
  editState = null;
  persistEntries();
  renderList();
  renderFilterChips();
  updateStatsLine();
}
function deleteEntry(id){
  if(!confirm("Delete this thought? This cannot be undone.")) return;
  entries = entries.filter(e => e.id !== id);
  if(editState && editState.id === id) editState = null;
  persistEntries();
  renderList();
  renderFilterChips();
  updateStatsLine();
}
function toggleDone(id, ev){
  if(ev) ev.stopPropagation();
  const e = entries.find(x => x.id === id);
  if(!e) return;
  e.done = !e.done;
  e.updatedAt = Date.now();
  persistEntries();
  refreshCard(id);
  renderFilterChips();
}

/* ---------- settings ---------- */

function openSettings(){
  document.getElementById("settingsBody").innerHTML = settingsBodyHTML();
  document.getElementById("settingsSheet").classList.add("open");
}
function closeSettings(){ document.getElementById("settingsSheet").classList.remove("open"); }
function refreshSettings(){
  if(document.getElementById("settingsSheet").classList.contains("open")){
    document.getElementById("settingsBody").innerHTML = settingsBodyHTML();
  }
}
function renderTopicManager(){
  const rows = topics.slice().sort((a, b) => a.localeCompare(b)).map(t => {
    const count = entries.filter(e => e.topic === t).length;
    return `<div class="topic-row">
      <span class="chip" style="--c:${topicColor(t)}">${esc(t)}</span>
      <span class="topic-count">${count}</span>
      <button type="button" data-topic="${esc(t)}" onclick="renameTopic(this.dataset.topic)">Rename</button>
      <button type="button" class="danger" data-topic="${esc(t)}" onclick="deleteTopic(this.dataset.topic)">Delete</button>
    </div>`;
  }).join("");
  return rows || `<div class="muted small">No topics yet — add one from the composer.</div>`;
}
function settingsBodyHTML(){
  return `
    <div class="settings-section">
      <div class="settings-row">${entries.length} thought${entries.length === 1 ? "" : "s"} stored on this device</div>
      <button type="button" class="btn-primary full" onclick="exportData()">⬇️ Export backup (JSON)</button>
      <label class="btn-secondary full file-btn">⬆️ Import backup
        <input type="file" accept="application/json" style="display:none" onchange="importDataFile(event)">
      </label>
    </div>
    <div class="settings-section">
      <h4>Topics</h4>
      ${renderTopicManager()}
    </div>
    <div class="settings-section">
      <button type="button" class="btn-danger full" onclick="clearAllData()">🗑️ Delete all thoughts</button>
    </div>
    <p class="muted small">Everything is stored only in this browser on this device — nothing is uploaded anywhere. Use Export to back up or move your thoughts to another device, then Import there.</p>
  `;
}
function renameTopic(oldName){
  const name = prompt("Rename topic", oldName);
  if(name == null) return;
  const trimmed = name.trim();
  if(!trimmed || trimmed === oldName) return;
  if(topics.some(t => t.toLowerCase() === trimmed.toLowerCase())){
    alert("A topic with that name already exists.");
    return;
  }
  topics = topics.map(t => (t === oldName ? trimmed : t));
  entries.forEach(e => { if(e.topic === oldName) e.topic = trimmed; });
  persistTopics();
  persistEntries();
  renderAll();
  refreshSettings();
}
function deleteTopic(name){
  if(!confirm(`Delete topic "${name}"? Thoughts in it become Uncategorized.`)) return;
  topics = topics.filter(t => t !== name);
  entries.forEach(e => { if(e.topic === name) e.topic = ""; });
  persistTopics();
  persistEntries();
  renderAll();
  refreshSettings();
}
function exportData(){
  const payload = { version: 1, exportedAt: new Date().toISOString(), topics, entries };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `thoughts-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importDataFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const incoming = Array.isArray(data.entries) ? data.entries : [];
      const existingIds = new Set(entries.map(e => e.id));
      let added = 0;
      for(const e of incoming){
        if(e && e.id && !existingIds.has(e.id)){
          entries.push({
            id: e.id,
            text: String(e.text || ""),
            topic: String(e.topic || ""),
            needsAction: !!e.needsAction,
            actionNote: String(e.actionNote || ""),
            done: !!e.done,
            createdAt: e.createdAt || Date.now(),
            updatedAt: e.updatedAt || Date.now()
          });
          existingIds.add(e.id);
          added++;
        }
      }
      if(Array.isArray(data.topics)){
        for(const t of data.topics) if(t && !topics.includes(t)) topics.push(t);
      }
      entries.sort((a, b) => b.createdAt - a.createdAt);
      persistEntries();
      persistTopics();
      renderAll();
      refreshSettings();
      alert(`Imported ${added} new thought(s).`);
    }catch(err){
      alert("Could not read that file — is it a Thoughts backup JSON?");
    }
    ev.target.value = "";
  };
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm("Delete ALL thoughts on this device? This cannot be undone. Export a backup first if unsure.")) return;
  entries = [];
  persistEntries();
  renderAll();
  refreshSettings();
}

/* ---------- install hint ---------- */

function isStandalone(){
  return window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
}
function maybeShowInstallHint(){
  if(isStandalone()) return;
  if(localStorage.getItem(LS_INSTALL_DISMISS) === "1") return;
  const isIOS = /iP(hone|od|ad)/.test(navigator.platform) || (navigator.userAgent.includes("Mac") && navigator.maxTouchPoints > 1);
  if(!isIOS) return;
  document.getElementById("installHint").style.display = "flex";
}
function dismissInstallHint(){
  localStorage.setItem(LS_INSTALL_DISMISS, "1");
  document.getElementById("installHint").style.display = "none";
}

/* ---------- init ---------- */

function updateStatsLine(){
  document.getElementById("statsLine").textContent = `${entries.length} thought${entries.length === 1 ? "" : "s"} captured`;
}
function renderAll(){
  renderComposerExtras();
  renderFilterChips();
  renderList();
  updateStatsLine();
}

renderAll();
maybeShowInstallHint();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
